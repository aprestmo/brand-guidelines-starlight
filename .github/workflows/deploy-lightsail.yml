name: Deploy to AWS Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable ECR image tag to deploy for a rollback
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: lightsail-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_github_oidc_provider_arn: ${{ vars.AWS_GITHUB_OIDC_PROVIDER_ARN }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
  TF_VAR_terraform_state_bucket: ${{ vars.TF_STATE_BUCKET }}

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select image tag
        id: image
        shell: bash
        run: |
          image_tag="${{ inputs.image_tag }}"
          if [[ -z "$image_tag" ]]; then
            image_tag="sha-${GITHUB_SHA}"
          fi
          printf 'tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Log in to Amazon ECR
        if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Initialize Terraform
        working-directory: infra/lightsail
        run: |
          terraform init \
            -backend-config="bucket=${TF_VAR_terraform_state_bucket}" \
            -backend-config="region=${AWS_REGION}"

      - name: Validate Terraform
        working-directory: infra/lightsail
        run: terraform validate

      - name: Plan Terraform deployment
        working-directory: infra/lightsail
        run: terraform plan -input=false -out=tfplan -var="image_tag=${{ steps.image.outputs.tag }}"

      - name: Apply Terraform deployment
        working-directory: infra/lightsail
        run: terraform apply -input=false -auto-approve tfplan
